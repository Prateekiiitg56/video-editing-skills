name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Python deps
        run: python -m pip install -r requirements.txt
      - name: Validate skills, packs and marketplace
        shell: bash
        run: |
          python - <<'EOF'
          import json, os, re, sys
          bad = []
          for d in sorted(os.listdir("skills")):
              s = open(f"skills/{d}/SKILL.md", encoding="utf-8").read()
              m = re.match(r"---\nname: (.+)\ndescription: (.+)\n---\n", s)
              if not m or m.group(1) != d or len(m.group(2)) > 1024:
                  bad.append(d)
          packs = {l.strip() for f in os.listdir("packs") for l in open("packs/" + f) if l.strip()}
          missing = packs - set(os.listdir("skills"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          paths = {p[len("./skills/"):] for pl in market["plugins"] for p in pl["skills"]}
          print("bad frontmatter:", bad, "| missing from skills/:", missing, "| marketplace orphans:", paths - set(os.listdir("skills")))
          sys.exit(1 if bad or missing or paths - set(os.listdir("skills")) else 0)
          EOF
      - name: Smoke test (all helper scripts)
        run: python tests/smoke_test.py
      - name: Installer (bash)
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/h1"; mkdir -p "$HOME"
          bash install.sh --pack reels
          test "$(ls "$HOME/.claude/skills" | wc -l)" -eq "$(wc -l < packs/reels.txt)"
          bash install.sh --skills style-cinematic --agent codex
          test -f "$HOME/.codex/skills/video-editing/SKILL.md"
          bash install.sh --pack reels --uninstall
          test "$(ls "$HOME/.claude/skills" | wc -l)" -eq 0
      - name: Installer (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "p1"; New-Item -ItemType Directory $d | Out-Null; Push-Location $d
          & "$env:GITHUB_WORKSPACE\install.ps1" -Pack cinematic -Project
          $n = (Get-ChildItem .claude\skills).Count
          $want = (Get-Content "$env:GITHUB_WORKSPACE\packs\cinematic.txt" | Where-Object { $_.Trim() }).Count
          if ($n -ne $want) { throw "expected $want skills, got $n" }
          Pop-Location
